# ONLYOFFICE Docs (Document Server, community edition) as a Harbor app: the online editors
# Nextcloud's `onlyoffice` connector opens documents in. One container, as ONLYOFFICE ships it
# (PostgreSQL, RabbitMQ, Redis and the document services run inside the image under supervisor).
# The JWT secret is generated by Harbor and injected as JWT_SECRET; nothing secret lives here.
# The image is pinned by digest.
services:
  documentserver:
    # 9.4.0.1 (also `latest` when pinned)
    image: onlyoffice/documentserver@sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
    environment:
      # Every request to the document server (and every callback it sends to Nextcloud) is signed.
      JWT_ENABLED: "true"
      JWT_HEADER: Authorization
      # Nextcloud is reached by its public name. When that name resolves to a private address
      # (split DNS, NAT hairpin, both apps on one Harbor), ONLYOFFICE's request filter would refuse
      # to download the document. Private addresses are allowed; link-local/metadata ones are not.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      # Nextcloud talks to it through the regular editor API, not WOPI.
      WOPI_ENABLED: "false"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1/healthcheck]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - {type: volume, source: data, target: /var/www/onlyoffice/Data}
      - {type: volume, source: logs, target: /var/log/onlyoffice}
      - {type: volume, source: lib, target: /var/lib/onlyoffice}
      - {type: volume, source: db, target: /var/lib/postgresql}
      - {type: volume, source: fonts, target: /usr/share/fonts/truetype/custom}

volumes:
  data: {}
  logs: {}
  lib: {}
  db: {}
  fonts: {}
